name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "$EC2_USER" || (echo "Missing EC2_USER secret" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing EC2_SSH_KEY secret" && exit 1)

      - name: Copy application files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "index.html,Dockerfile"
          target: "/home/ec2-user/team-e-devops"

      - name: Build and restart Docker container on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /home/ec2-user/team-e-devops
            sudo docker build -t team-e-devops-app:latest .
            sudo docker rm -f team-e-devops-app 2>/dev/null || true
            sudo docker run -d \
              --name team-e-devops-app \
              --restart unless-stopped \
              -p 80:80 \
              team-e-devops-app:latest
            sudo docker ps --filter name=team-e-devops-app
            curl --fail --silent --show-error http://localhost/ >/dev/null
            echo "Deployment completed successfully."
